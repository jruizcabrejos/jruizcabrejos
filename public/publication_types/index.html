<script>
  document.addEventListener('DOMContentLoaded', () => {
    const element = document.getElementById('search');
    const trigger = document.getElementById('search_toggle');
    const config = window.hbb && window.hbb.pagefind;

    if (!element || !trigger || !config) {
      return;
    }

    let initialized = false;
    let initializationPromise = null;

    const setExpanded = (expanded) => {
      element.classList.toggle('hidden', !expanded);
      trigger.setAttribute('aria-expanded', String(expanded));
    };

    const removeFailedAsset = (asset) => {
      asset.remove();
    };

    const loadStylesheet = () => new Promise((resolve, reject) => {
      const existing = document.querySelector('link[data-pagefind-ui-styles]');
      if (existing) {
        if (existing.dataset.loaded === 'true') {
          resolve();
          return;
        }
        existing.addEventListener('load', resolve, { once: true });
        existing.addEventListener('error', () => reject(new Error('Pagefind UI styles failed to load.')), { once: true });
        return;
      }

      const stylesheet = document.createElement('link');
      stylesheet.rel = 'stylesheet';
      stylesheet.href = config.cssUrl;
      stylesheet.integrity = config.cssIntegrity;
      stylesheet.dataset.pagefindUiStyles = '';
      stylesheet.addEventListener('load', () => {
        stylesheet.dataset.loaded = 'true';
        resolve();
      }, { once: true });
      stylesheet.addEventListener('error', () => {
        removeFailedAsset(stylesheet);
        reject(new Error('Pagefind UI styles failed to load.'));
      }, { once: true });
      document.head.appendChild(stylesheet);
    });

    const loadScript = () => new Promise((resolve, reject) => {
      if (typeof window.PagefindUI === 'function') {
        resolve();
        return;
      }

      const existing = document.querySelector('script[data-pagefind-ui-script]');
      if (existing) {
        existing.addEventListener('load', resolve, { once: true });
        existing.addEventListener('error', () => reject(new Error('Pagefind UI script failed to load.')), { once: true });
        return;
      }

      const script = document.createElement('script');
      script.src = config.jsUrl;
      script.integrity = config.jsIntegrity;
      script.async = true;
      script.dataset.pagefindUiScript = '';
      script.addEventListener('load', () => {
        if (typeof window.PagefindUI === 'function') {
          resolve();
        } else {
          removeFailedAsset(script);
          reject(new Error('Pagefind UI did not initialize.'));
        }
      }, { once: true });
      script.addEventListener('error', () => {
        removeFailedAsset(script);
        reject(new Error('Pagefind UI script failed to load.'));
      }, { once: true });
      document.head.appendChild(script);
    });

    const closeSearch = () => {
      setExpanded(false);
    };

    const attachClearHandler = () => {
      const clearTrigger = element.querySelector('.pagefind-ui__search-clear');
      if (!clearTrigger || clearTrigger.dataset.closesSearch === 'true') {
        return;
      }
      clearTrigger.dataset.closesSearch = 'true';
      clearTrigger.addEventListener('click', closeSearch);
    };

    const initializeSearch = () => {
      if (initialized) {
        return Promise.resolve();
      }
      if (initializationPromise) {
        return initializationPromise;
      }

      initializationPromise = Promise.all([loadStylesheet(), loadScript()])
        .then(() => {
          element.replaceChildren();
          new window.PagefindUI({
            element: '#search',
            showSubResults: true,
            baseUrl: config.baseUrl,
            bundlePath: config.bundlePath,
          });
          initialized = true;
          attachClearHandler();
        })
        .catch((error) => {
          initializationPromise = null;
          throw error;
        });

      return initializationPromise;
    };

    const showStatus = (message, role) => {
      const status = document.createElement('p');
      status.setAttribute('role', role);
      status.textContent = message;
      element.replaceChildren(status);
    };

    const focusEmptyInput = () => {
      const input = element.querySelector('input');
      if (!input) {
        return;
      }
      input.value = '';
      input.focus();
    };

    const openSearch = async () => {
      setExpanded(true);

      if (!initialized) {
        element.setAttribute('aria-busy', 'true');
        showStatus('Loading search\u2026', 'status');
      }

      try {
        await initializeSearch();
        element.removeAttribute('aria-busy');
        if (!element.classList.contains('hidden')) {
          focusEmptyInput();
        }
      } catch (error) {
        element.removeAttribute('aria-busy');
        showStatus('Search could not be loaded. Close and reopen it to try again.', 'alert');
        console.error(error);
      }
    };

    trigger.addEventListener('click', () => {
      if (element.classList.contains('hidden')) {
        openSearch();
      } else {
        focusEmptyInput();
        closeSearch();
      }
    });
  });
</script>

      <script>
  document.addEventListener('DOMContentLoaded', function () {
    const links = Array.from(
      document.querySelectorAll('.hb-toc a[href^="#"], .hb-sidebar-mobile-toc a[href^="#"]')
    );

    if (!links.length) {
      return;
    }

    const groups = new Map();
    const orderedIds = [];

    links.forEach((link) => {
      const id = decodeURIComponent(link.getAttribute('href').slice(1));
      const target = document.getElementById(id);

      if (!target) {
        return;
      }

      if (!groups.has(id)) {
        groups.set(id, { target, links: [] });
        orderedIds.push(id);
      }

      groups.get(id).links.push(link);
    });

    if (!orderedIds.length) {
      return;
    }

    const setActive = (id) => {
      links.forEach((link) => {
        const linkId = decodeURIComponent(link.getAttribute('href').slice(1));
        link.classList.toggle('is-active', linkId === id);
      });
    };

    const visibleIds = new Set();
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            visibleIds.add(entry.target.id);
          } else {
            visibleIds.delete(entry.target.id);
          }
        });

        const currentId = orderedIds.find((id) => visibleIds.has(id));
        if (currentId) {
          setActive(currentId);
        }
      },
      {
        rootMargin: '0px 0px -70% 0px',
        threshold: [0, 1],
      }
    );

    orderedIds.forEach((id) => {
      observer.observe(groups.get(id).target);
    });

    const syncHash = () => {
      const id = decodeURIComponent(window.location.hash.replace(/^#/, ''));
      if (id && groups.has(id)) {
        setActive(id);
      }
    };

    window.addEventListener('hashchange', syncHash);

    if (window.location.hash) {
      syncHash();
    } else {
      setActive(orderedIds[0]);
    }
  });
</script>

      <script>
  (() => {
    const setupPagenotes = () => {
      const desktop = window.matchMedia('(min-width: 1280px)');
      const notes = Array.from(document.querySelectorAll('.post-body .page-note-anchor'))
        .map((anchor) => ({
          anchor,
          note: anchor.querySelector('.page-note'),
          container: anchor.closest('p, li'),
        }))
        .filter(({ note, container }) => note && container);

      if (!notes.length) {
        return;
      }

      const placeNotes = () => {
        notes.forEach(({ anchor, note, container }) => {
          if (desktop.matches) {
            anchor.append(note);
          } else {
            container.append(note);
          }
        });
      };

      placeNotes();

      if (desktop.addEventListener) {
        desktop.addEventListener('change', placeNotes);
      } else {
        desktop.addListener(placeNotes);
      }
    };

    setupPagenotes();
  })();
</script>
